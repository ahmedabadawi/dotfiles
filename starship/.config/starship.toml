"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration
$line_break\
$character"""

right_format = ""
add_newline = true

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold magenta"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "yellow"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "dimmed yellow"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "

[python]
symbol = " "
format = "[$symbol$version]($style) "

[rust]
symbol = " "
format = "[$symbol$version]($style) "

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[java]
symbol = " "
format = "[$symbol$version]($style) "

[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = false
