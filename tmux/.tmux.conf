# ~/.tmux.conf — minimal, plugin-free. Default C-b prefix.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- vi-style copy mode -----------------------------------------------
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Clipboard: macOS uses pbcopy; if this config ever runs on Linux
# (portability goal), fall back to xclip/xsel. tmux runs this via `sh -c`,
# so it's plain shell, not tmux config syntax.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel " \
  if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
  elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; \
  elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; \
  else cat >/dev/null; fi"

# --- pane splits & navigation -------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- status bar: minimal --------------------------------------------------
set -g status-style "bg=default"
set -g status-left "#[bold] #S "
set -g status-left-length 20
set -g status-right "%Y-%m-%d %H:%M"
set -g status-justify centre
setw -g window-status-current-style "bold"
